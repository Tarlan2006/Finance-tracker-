name = "finance-tracker"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
SHEET_NAME_EXPENSES = "Ввод данных"
SHEET_NAME_DICT = "Справочник"
SHEET_NAME_INCOME = "Доходы и расходы"
TZ = "Asia/Almaty"
CURRENCY = "₸"
DUPLICATE_WINDOW_MIN = "3"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "SheetCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SheetCoordinator"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountsDO"

[[migrations]]
tag = "v2-accounts"
new_sqlite_classes = ["AccountsDO"]
